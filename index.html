<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quadro Elétrico WebXR</title>
    <style>
      body {
        margin: 0;
        background-color: #111;
        color: #fff;
        font-family: sans-serif;
        overflow: hidden;
      }

      #info {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        z-index: 100;
      }

      .painel {
        position: absolute;
        background: rgba(0, 0, 0, 0.7);
        padding: 12px 15px;
        border-radius: 8px;
        z-index: 100;
        font-size: 14px;
        max-width: 340px;
      }

      .painel p {
        margin: 4px 0;
      }

      #painel-sonda-xr {
        top: 50px;
        left: 20px;
      }

      #painel-estrutura {
        top: 50px;
        right: 20px;
        max-height: 80vh;
        overflow-y: auto;
      }

      #painel-estrutura button {
        display: block;
        width: 100%;
        margin: 6px 0;
        padding: 8px;
        font-size: 14px;
        cursor: pointer;
      }

      #painel-estrutura pre {
        font-size: 12px;
        background: #1c1f27;
        padding: 8px;
        border-radius: 4px;
        white-space: pre-wrap;
      }

      #botao-paineis {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 200;
        padding: 8px 12px;
        font-size: 14px;
      }

      .sem-paineis .painel {
        display: none;
      }

      @media (max-width: 800px) {
        .painel {
          font-size: 11px;
          max-width: 42vw;
          max-height: 45vh;
          overflow-y: auto;
          padding: 8px;
        }

        .painel h3 {
          margin: 0 0 6px 0;
        }

        #painel-sonda-xr {
          left: 6px;
        }

        #painel-estrutura {
          right: 6px;
          max-height: 45vh;
        }

        #painel-estrutura button {
          font-size: 11px;
          padding: 6px;
        }

        #info {
          display: none;
        }
      }

      #app {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="info">Clique em ENTER VR ou START AR...</div>
    <button id="botao-paineis" onclick="document.body.classList.toggle('sem-paineis')">Painéis</button>

    <div id="painel-sonda-xr" class="painel">
      <h3>Sonda WebXR</h3>
      <p><strong>API WebXR:</strong> <span id="status-api">⏳ Carregando...</span></p>
      <p><strong>Regime VR:</strong> <span id="status-vr">⏳ Carregando...</span></p>
      <p><strong>Regime AR:</strong> <span id="status-ar">⏳ Carregando...</span></p>
      <hr style="border-color: #444; margin: 12px 0;">
      <h4>Durante a sessão</h4>
      <div id="lista-recursos"></div>
      <p><strong>Fontes de entrada:</strong> <span id="status-fontes">Sem sessão aberta</span></p>
      <p><strong>Graus de liberdade:</strong> <span id="status-graus">Sem sessão aberta</span></p>
    </div>

    <div id="painel-estrutura" class="painel">
      <h3>Cena</h3>
      <p id="mensagem">Clique numa peça da bancada</p>
      <button id="botao-encaixar">Prender disjuntor-1 no trilho</button>
      <button id="botao-mover">Mover o quadro</button>
      <button id="botao-lenta">Simular máquina lenta</button>
      <pre id="resultado-troca">Nenhuma troca de pai ainda</pre>
    </div>

    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
