<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quadro Elétrico WebXR — Módulo 3</title>
    <style>
      body {
        margin: 0;
        background-color: #111;
        color: #fff;
        font-family: sans-serif;
        overflow: hidden;
      }

      #info {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        z-index: 100;
      }

      .painel {
        position: absolute;
        background: rgba(0, 0, 0, 0.7);
        padding: 12px 15px;
        border-radius: 8px;
        z-index: 100;
        font-size: 14px;
        max-width: 340px;
      }

      .painel p {
        margin: 4px 0;
      }

      #painel-estrutura {
        top: 50px;
        right: 20px;
        max-height: 80vh;
        overflow-y: auto;
      }

      #painel-estrutura button {
        display: block;
        width: 100%;
        margin: 6px 0;
        padding: 8px;
        font-size: 14px;
        cursor: pointer;
      }

      #painel-estrutura pre {
        font-size: 12px;
        background: #1c1f27;
        padding: 8px;
        border-radius: 4px;
        white-space: pre-wrap;
      }

      #botao-paineis {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 200;
        padding: 8px 12px;
        font-size: 14px;
      }

      .sem-paineis .painel {
        display: none;
      }

      @media (max-width: 800px) {
        .painel {
          font-size: 11px;
          max-width: 42vw;
          max-height: 45vh;
          overflow-y: auto;
          padding: 8px;
        }

        .painel h3 {
          margin: 0 0 6px 0;
        }

        #painel-estrutura {
          right: 6px;
          max-height: 45vh;
        }

        #painel-estrutura button {
          font-size: 11px;
          padding: 6px;
        }

        #info {
          display: none;
        }
      }

      #app {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="info">Use os botões para entrar em VR/AR e montar o quadro</div>
    <button id="botao-paineis" onclick="document.body.classList.toggle('sem-paineis')">Painéis</button>

    <div id="painel-estrutura" class="painel">
      <h3>Cena</h3>
      <p id="mensagem">Escolha uma peça para colocar</p>
      <button id="botao-disjuntor-1">Colocar disjuntor 1</button>
      <button id="botao-disjuntor-2">Colocar disjuntor 2</button>
      <button id="botao-disjuntor-3">Colocar disjuntor 3</button>
      <button id="botao-barramento">Colocar barramento</button>
      <button id="botao-fio-1">Ligar fio 1</button>
      <button id="botao-fio-2">Ligar fio 2</button>
      <button id="botao-fio-3">Ligar fio 3</button>
      <button id="botao-fio-4">Ligar fio 4</button>
      <button id="botao-fio-5">Ligar fio 5</button>
      <button id="botao-fio-6">Ligar fio 6</button>
      <button id="botao-encaixar">Prender disjuntor-1 no trilho</button>
      <button id="botao-mover">Mover o quadro</button>
      <button id="botao-lenta">Simular máquina lenta</button>
      <pre id="resultado-troca">Nenhuma troca de pai ainda</pre>
    </div>

    <div id="app"></div>

    <script type="module" src="/src/demos/03_demo.ts"></script>
  </body>
</html>
